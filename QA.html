<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多模態持久化知識庫系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="h-full flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="h-14 border-b border-slate-800 bg-slate-950 px-4 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-indigo-600/20 text-indigo-400 rounded-lg">
                <i data-lucide="database" class="w-5 h-5"></i>
            </div>
            <h1 class="font-bold text-lg text-slate-100">多模態持久化知識庫問答系統</h1>
            <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                資料庫已連線 (常駐儲存)
            </span>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openConfigModal()" class="flex items-center space-x-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-md transition border border-slate-700">
                <i data-lucide="settings" class="w-4 h-4"></i>
                <span>API & Database 設定</span>
            </button>
        </div>
    </header>

    <!-- Main Container (Split Screen) -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Left Panel: Document Library & Chat (Width: 50%) -->
        <div class="w-1/2 flex flex-col border-r border-slate-800 bg-slate-900/50">
            
            <!-- Knowledge Repository Bar (Persisted files) -->
            <div class="p-3 bg-slate-950/60 border-b border-slate-800">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                        <i data-lucide="folder-git-2" class="w-4 h-4 text-indigo-400"></i>
                        已索引之持久化檔案庫 (不必重複上傳)
                    </span>
                    <button onclick="document.getElementById('fileUploadInput').click()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1 rounded transition flex items-center gap-1">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        新增檔案到資料庫
                    </button>
                    <input type="file" id="fileUploadInput" class="hidden" accept="video/*,audio/*,.pdf" onchange="handleFileUpload(event)">
                </div>

                <!-- Persisted Files Pills -->
                <div id="fileList" class="flex flex-wrap gap-2 max-h-24 overflow-y-auto pt-1">
                    <!-- Dynamic rendering of files -->
                </div>
            </div>

            <!-- Chat Area -->
            <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Welcome Message -->
                <div class="flex gap-3 text-sm">
                    <div class="w-8 h-8 rounded-full bg-indigo-600/30 text-indigo-400 border border-indigo-500/30 flex items-center justify-center shrink-0">
                        <i data-lucide="bot" class="w-4 h-4"></i>
                    </div>
                    <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-3.5 text-slate-200 max-w-[85%] leading-relaxed">
                        歡迎使用！下方檔案庫中的資料已完成向量化並固定存放在資料庫中。
                        <br>您可以直接對這些資料進行提問，點擊回答中的引述標籤即可在右側預覽對應的時間軸或頁面。
                    </div>
                </div>
            </div>

            <!-- Chat Input Bar -->
            <div class="p-3 border-t border-slate-800 bg-slate-950">
                <form onsubmit="handleSendQuestion(event)" class="flex gap-2">
                    <input 
                        type="text" 
                        id="userInput" 
                        placeholder="請輸入關於已儲存檔案的問題... (如：設備如何保養？)" 
                        class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
                    >
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1.5 shrink-0">
                        <span>發送</span>
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- Right Panel: Multi-Modal Previewer (Width: 50%) -->
        <div class="w-1/2 flex flex-col bg-slate-950">
            <!-- Preview Header -->
            <div class="h-10 border-b border-slate-800 px-4 flex items-center justify-between bg-slate-900/80">
                <span id="previewTitle" class="text-xs font-medium text-slate-300 flex items-center gap-2">
                    <i data-lucide="eye" class="w-4 h-4 text-indigo-400"></i>
                    內容定位預覽區 (點擊左側對話連結可自動跳轉)
                </span>
                <span id="previewBadge" class="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-400 font-mono">未載入內容</span>
            </div>

            <!-- Viewer Container -->
            <div id="viewerContainer" class="flex-1 flex flex-col items-center justify-center p-6 overflow-y-auto">
                <!-- Default Placeholder -->
                <div id="emptyState" class="text-center text-slate-500">
                    <i data-lucide="file-search" class="w-12 h-12 mx-auto mb-3 text-slate-600 stroke-[1.5]"></i>
                    <p class="text-sm">在左側問答中點擊出處連結 (例如 <span class="text-indigo-400 border border-indigo-500/30 px-1 py-0.5 rounded">01:25</span>)</p>
                    <p class="text-xs text-slate-600 mt-1">此區將自動跳轉播放影片或導引至 PDF 特定頁面</p>
                </div>

                <!-- Video Player Container (Hidden by default) -->
                <div id="videoViewer" class="hidden w-full max-w-2xl flex-col items-center">
                    <video id="mainVideoPlayer" controls class="w-full rounded-lg border border-slate-800 shadow-2xl bg-black">
                        <source id="videoSource" src="" type="video/mp4">
                        您的瀏覽器不支援影片播放。
                    </video>
                    <div class="mt-3 w-full bg-slate-900 border border-slate-800 rounded-lg p-3 flex justify-between items-center text-xs">
                        <span class="text-slate-400">目前時間點: <strong id="videoCurrentTime" class="text-indigo-400 font-mono">00:00</strong></span>
                        <span class="text-slate-500">提示: 點擊問答標籤可控制 currentTime</span>
                    </div>
                </div>

                <!-- PDF / Text Doc Viewer (Hidden by default) -->
                <div id="documentViewer" class="hidden w-full h-full flex flex-col bg-slate-900 border border-slate-800 rounded-lg overflow-hidden">
                    <div class="bg-slate-800 px-4 py-2 border-b border-slate-700 flex justify-between items-center text-xs text-slate-300">
                        <span id="docTitle">文件預覽</span>
                        <span id="docPageIndicator" class="bg-indigo-600/30 text-indigo-300 px-2 py-0.5 rounded border border-indigo-500/30">第 1 頁</span>
                    </div>
                    <div id="docContentArea" class="flex-1 p-6 overflow-y-auto space-y-4 font-serif text-slate-300 leading-relaxed text-sm">
                        <!-- Rendered Document Page Chunks -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Configuration Modal -->
    <div id="configModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center hidden z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 w-full max-w-md shadow-2xl">
            <h3 class="text-base font-bold text-slate-100 mb-4 flex items-center gap-2">
                <i data-lucide="database" class="w-5 h-5 text-indigo-400"></i>
                儲存庫連線設定 (Supabase & Gemini)
            </h3>
            <div class="space-y-4 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">Supabase URL</label>
                    <input type="text" id="supabaseUrl" placeholder="https://your-project.supabase.co" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Supabase Anon Key</label>
                    <input type="password" id="supabaseKey" placeholder="your-anon-key" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Gemini API Key (選填，展示模式會使用模擬回答)</label>
                    <input type="password" id="geminiKey" placeholder="AIzaSy..." class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-2">
                <button onclick="closeConfigModal()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs">取消</button>
                <button onclick="saveConfig()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-xs">儲存設定</button>
            </div>
        </div>
    </div>

    <!-- Application JavaScript Logic -->
    <script>
        // Mock Persistent Database State (Simulating Supabase pgvector stored documents)
        const DEFAULT_PERSISTED_DOCS = [
            {
                id: 'doc-1',
                title: '工業設備操作維修影片.mp4',
                type: 'video',
                url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4',
                chunksCount: 18,
                createdAt: '2026-10-10'
            },
            {
                id: 'doc-2',
                title: '2026產品操作手冊_v2.pdf',
                type: 'pdf',
                pages: [
                    { page: 1, text: "【第一章：設備總覽】本產品採用極化雙驅動結構，具備高效率、低能耗特色。請確保電源電壓為 220V AC。" },
                    { page: 2, text: "【第二章：安全規範】作業時必須佩戴絕緣手套。如有異常噪音，請立即按下緊急停止按鈕 (E-Stop)。" },
                    { page: 3, text: "【第三章：定期保養】濾網建議每 30 天進行清理一次，若積塵嚴重可能導致冷卻效能下降 40%。" }
                ],
                chunksCount: 12,
                createdAt: '2026-10-12'
            }
        ];

        // Initialize Local Storage for Persistence
        function loadDocsFromStorage() {
            const stored = localStorage.getItem('kb_persisted_docs');
            if (!stored) {
                localStorage.setItem('kb_persisted_docs', JSON.stringify(DEFAULT_PERSISTED_DOCS));
                return DEFAULT_PERSISTED_DOCS;
            }
            return JSON.parse(stored);
        }

        let dbDocs = loadDocsFromStorage();
        let selectedDocId = 'all'; // 'all' or specific document ID

        // Render Persisted File Badges
        function renderFileList() {
            const container = document.getElementById('fileList');
            container.innerHTML = '';

            // 'All' Filter Pill
            const allPill = document.createElement('button');
            allPill.className = `px-2.5 py-1 rounded-md text-xs flex items-center gap-1.5 border transition ${
                selectedDocId === 'all' 
                ? 'bg-indigo-600/30 text-indigo-300 border-indigo-500/50' 
                : 'bg-slate-900 text-slate-400 border-slate-800 hover:bg-slate-800'
            }`;
            allPill.onclick = () => selectFilter('all');
            allPill.innerHTML = `<i data-lucide="layers" class="w-3.5 h-3.5"></i> 搜尋全部庫 (All)`;
            container.appendChild(allPill);

            // Individual Document Pills
            dbDocs.forEach(doc => {
                const isSelected = selectedDocId === doc.id;
                const pill = document.createElement('div');
                pill.className = `flex items-center space-x-1 px-2.5 py-1 rounded-md text-xs border transition ${
                    isSelected 
                    ? 'bg-indigo-600/30 text-indigo-300 border-indigo-500/50' 
                    : 'bg-slate-900 text-slate-400 border-slate-800 hover:bg-slate-800'
                }`;

                const iconName = doc.type === 'video' ? 'video' : 'file-text';
                
                pill.innerHTML = `
                    <button class="flex items-center gap-1.5 text-left" onclick="selectFilter('${doc.id}')">
                        <i data-lucide="${iconName}" class="w-3.5 h-3.5 ${doc.type === 'video' ? 'text-amber-400' : 'text-rose-400'}"></i>
                        <span class="max-w-[120px] truncate">${doc.title}</span>
                    </button>
                    <button onclick="deleteDoc(event, '${doc.id}')" class="text-slate-500 hover:text-rose-400 ml-1 p-0.5 rounded">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                `;
                container.appendChild(pill);
            });
            lucide.createIcons();
        }

        function selectFilter(id) {
            selectedDocId = id;
            renderFileList();
        }

        function deleteDoc(event, id) {
            event.stopPropagation();
            if (confirm("確定要從持久化資料庫中移除此檔案與其向量切片嗎？")) {
                dbDocs = dbDocs.filter(d => d.id !== id);
                localStorage.setItem('kb_persisted_docs', JSON.stringify(dbDocs));
                if (selectedDocId === id) selectedDocId = 'all';
                renderFileList();
            }
        }

        // Simulate New File Processing & Storage (Single Write)
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const isVideo = file.type.startsWith('video/');
            const newDoc = {
                id: 'doc-' + Date.now(),
                title: file.name,
                type: isVideo ? 'video' : 'pdf',
                url: isVideo ? URL.createObjectURL(file) : '',
                pages: isVideo ? [] : [{ page: 1, text: `【解析結果】檔案 ${file.name} 內容切片示範...` }],
                chunksCount: 8,
                createdAt: new Date().toISOString().split('T')[0]
            };

            // Simulate parsing and embedding delay
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML += `
                <div class="flex gap-2 text-xs text-indigo-400 items-center my-2 p-2 bg-indigo-950/40 rounded border border-indigo-800/40">
                    <i data-lucide="loader" class="w-4 h-4 animate-spin"></i>
                    正在解析 ${file.name} 進行逐字稿轉換與向量 Embedding (僅需一次)...
                </div>
            `;
            lucide.createIcons();

            setTimeout(() => {
                dbDocs.push(newDoc);
                localStorage.setItem('kb_persisted_docs', JSON.stringify(dbDocs));
                renderFileList();
                chatMessages.innerHTML += `
                    <div class="flex gap-2 text-xs text-emerald-400 items-center my-2 p-2 bg-emerald-950/40 rounded border border-emerald-800/40">
                        <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                        解析完畢！已將切片與向量寫入資料庫。日後可直接提問，無需再重新上傳。
                    </div>
                `;
                chatMessages.scrollTop = chatMessages.scrollHeight;
                lucide.createIcons();
            }, 1500);
        }

        // Handle User Query (Reads directly from DB)
        function handleSendQuestion(e) {
            e.preventDefault();
            const input = document.getElementById('userInput');
            const q = input.value.trim();
            if (!q) return;

            const chatMessages = document.getElementById('chatMessages');

            // Append User Question
            chatMessages.innerHTML += `
                <div class="flex gap-3 text-sm justify-end">
                    <div class="bg-indigo-600 text-white rounded-xl p-3.5 max-w-[85%] leading-relaxed shadow-lg">
                        ${escapeHtml(q)}
                    </div>
                </div>
            `;
            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Simulate RAG Query Response from Vector Database
            setTimeout(() => {
                let responseHTML = "";

                if (q.includes("保養") || q.includes("濾網")) {
                    responseHTML = `
                        根據資料庫中持久化的《2026產品操作手冊_v2.pdf》與維修影片記錄：<br><br>
                        1. 濾網需要每 <strong>30 天</strong>定期清洗一次 
                           <button onclick="seekToPdf('doc-2', 3)" class="inline-flex items-center gap-1 text-xs bg-rose-500/20 text-rose-300 border border-rose-500/30 px-2 py-0.5 rounded font-mono hover:bg-rose-500/30 transition">
                               <i data-lucide="file-text" class="w-3 h-3"></i> PDF 第 3 頁
                           </button><br>
                        2. 若長期未清理，積塵將影響冷卻效能高達 40%。<br>
                        3. 影片實作操作範例可參考說明：
                           <button onclick="seekToVideo('doc-1', 15)" class="inline-flex items-center gap-1 text-xs bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded font-mono hover:bg-amber-500/30 transition">
                               <i data-lucide="play-circle" class="w-3 h-3"></i> 影片 00:15 秒處
                           </button>
                    `;
                } else if (q.includes("電壓") || q.includes("規格") || q.includes("安全")) {
                    responseHTML = `
                        從庫中的 PDF 文件檢索到以下規格與安全注意事項：<br><br>
                        • 系統標準額定電壓為 <strong>220V AC</strong> 
                          <button onclick="seekToPdf('doc-2', 1)" class="inline-flex items-center gap-1 text-xs bg-rose-500/20 text-rose-300 border border-rose-500/30 px-2 py-0.5 rounded font-mono hover:bg-rose-500/30 transition">
                              <i data-lucide="file-text" class="w-3 h-3"></i> PDF 第 1 頁
                          </button><br>
                        • 操作時請務必佩戴絕緣手套，遇到緊急情況請按紅色的 E-Stop 按鈕 
                          <button onclick="seekToPdf('doc-2', 2)" class="inline-flex items-center gap-1 text-xs bg-rose-500/20 text-rose-300 border border-rose-500/30 px-2 py-0.5 rounded font-mono hover:bg-rose-500/30 transition">
                              <i data-lucide="file-text" class="w-3 h-3"></i> PDF 第 2 頁
                          </button>
                    `;
                } else {
                    responseHTML = `
                        已搜尋持久化資料庫中的相關向量切片：<br><br>
                        維修示範影片有介紹關於整體設備運作狀況，詳情請參考：
                        <button onclick="seekToVideo('doc-1', 35)" class="inline-flex items-center gap-1 text-xs bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded font-mono hover:bg-amber-500/30 transition">
                            <i data-lucide="play-circle" class="w-3 h-3"></i> 影片 00:35 秒處
                        </button>
                    `;
                }

                chatMessages.innerHTML += `
                    <div class="flex gap-3 text-sm">
                        <div class="w-8 h-8 rounded-full bg-indigo-600/30 text-indigo-400 border border-indigo-500/30 flex items-center justify-center shrink-0">
                            <i data-lucide="bot" class="w-4 h-4"></i>
                        </div>
                        <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-3.5 text-slate-200 max-w-[85%] leading-relaxed">
                            ${responseHTML}
                        </div>
                    </div>
                `;
                chatMessages.scrollTop = chatMessages.scrollHeight;
                lucide.createIcons();
            }, 600);
        }

        // Action: Jump to Video Timestamp in Right Viewer
        function seekToVideo(docId, seconds) {
            const doc = dbDocs.find(d => d.id === docId);
            if (!doc) return;

            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('documentViewer').classList.add('hidden');
            
            const videoViewer = document.getElementById('videoViewer');
            const videoPlayer = document.getElementById('mainVideoPlayer');
            const videoSource = document.getElementById('videoSource');

            videoViewer.classList.remove('hidden');
            videoViewer.classList.add('flex');

            if (videoSource.src !== doc.url) {
                videoSource.src = doc.url;
                videoPlayer.load();
            }

            videoPlayer.currentTime = seconds;
            videoPlayer.play();

            document.getElementById('previewBadge').innerText = `影片: ${doc.title}`;
            document.getElementById('videoCurrentTime').innerText = formatTime(seconds);

            videoPlayer.ontimeupdate = () => {
                document.getElementById('videoCurrentTime').innerText = formatTime(videoPlayer.currentTime);
            };
        }

        // Action: Jump to PDF Page in Right Viewer
        function seekToPdf(docId, pageNum) {
            const doc = dbDocs.find(d => d.id === docId);
            if (!doc) return;

            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('videoViewer').classList.add('hidden');

            const docViewer = document.getElementById('documentViewer');
            const docTitle = document.getElementById('docTitle');
            const docPageIndicator = document.getElementById('docPageIndicator');
            const docContentArea = document.getElementById('docContentArea');

            docViewer.classList.remove('hidden');
            docTitle.innerText = doc.title;
            docPageIndicator.innerText = `第 ${pageNum} 頁`;

            // Render mock pages with highlight
            docContentArea.innerHTML = doc.pages.map(p => `
                <div class="p-4 rounded-lg border ${p.page === pageNum ? 'bg-indigo-950/40 border-indigo-500/50 ring-1 ring-indigo-500/30' : 'bg-slate-950 border-slate-800'} transition">
                    <div class="text-xs font-mono text-slate-500 mb-2 flex justify-between">
                        <span>PAGE ${p.page}</span>
                        ${p.page === pageNum ? '<span class="text-indigo-400 font-bold">● 引述目標頁面</span>' : ''}
                    </div>
                    <p class="text-slate-200">${p.text}</p>
                </div>
            `).join('');

            document.getElementById('previewBadge').innerText = `文件: ${doc.title}`;
        }

        // Helper Functions
        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function openConfigModal() { document.getElementById('configModal').classList.remove('hidden'); }
        function closeConfigModal() { document.getElementById('configModal').classList.add('hidden'); }
        function saveConfig() {
            closeConfigModal();
            alert("設定已儲存！");
        }

        // Initialize UI
        renderFileList();
        lucide.createIcons();
    </script>
